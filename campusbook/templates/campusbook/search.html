{% extends 'campusbook/base.html' %}
{% load static %}
{% block content %}

<!-- Search Bar -->
<form action="{% url 'campusbook:search' %}" method="POST">
{% csrf_token %}
<div class="field is-grouped">
  <p class="control is-expanded">
    <input class="input is-rounded" name="q" type="text" placeholder="Name / Username / Roll No" value="{{query}}">
  </p>
  <p class="control">
    <button class="button is-rounded is-link" type="submit">
      <b>Search</b>
    </button>
  </p>
</div>
</form>
<br>

<!-- Search By Course -->
<div class="tags are-medium">
  {% for course_branch in course_branches %}
  <a href="{% url 'campusbook:search_by_course_branch' course_branch.title %}"
     class="tag is-rounded is-medium is-warning"><b>{{course_branch.title}}</b>
  </a>
  {% endfor %}
</div>

<!-- Search Results -->
{% for user in users %}
{% include 'users/user-div.html' %}
{% endfor %}

{% endblock content %}
